[package]
name = "ping"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = ["noise", "ping", "tcp", "tokio", "yamux"] }
futures = "0.3.31"
tokio = { version = "1.37.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }