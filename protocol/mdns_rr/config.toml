[server]
listen_address = "/ip4/0.0.0.0/tcp/0"

[p2p]
protocol_name = "/chat/1.0.0"
max_streams = 2048
max_concurrent_streams = 2048
semaphore_permits = 1

[gossip]
max_transmit_size = 1048576
heartbeat_interval = 10

[queue]
capacity = 100000
high_priority_threshold = 1000

[logging]
level = "info"
enable_debug = false

[mdns]
enabled = true

[ws]
host = "127.0.0.1"
port = 3000
max_clients = 1000
heartbeat_interval = 30

[http]
enabled = true
address = "0.0.0.0:8080"

[kafka]
bootstrap_servers = "127.0.0.1:9094"
consumer = { group_id = "rust-benchmark", default_topic = "benchmark-messages" }

[channel]
command_buffer_size = 1_000_000
event_buffer_size = 1_000_000
