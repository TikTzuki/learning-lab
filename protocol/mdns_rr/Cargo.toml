[package]

name = "mdns_rr"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.6", features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
libp2p-stream = { version = "0.4.0-alpha" }
libp2p = { workspace = true, features = ["tokio", "gossipsub", "metrics",
    "mdns", "noise", "macros", "tcp", "yamux", "quic", "request-response", "cbor", "identify"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
log = { workspace = true }
env_logger = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio-tungstenite = "0.27.0"
futures-util = "0.3.31"
serde_json = "1.0.141"
config = { workspace = true }
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"] }
axum = "0.7"
prometheus-client = { version = "0.23.1" }
async-trait = "0.1"
#prometheus = "0.13"
#metrics = "0.21"
#metrics-exporter-prometheus = "0.12"
once_cell = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
