  node1:
    image: tiktuzki/mdns_rr:latest
    container_name: node1
    hostname: node1
    ports:
      - "8090:8080"
      - "3010:3000"
    expose:
      - "8080"
      - "3000"
    environment:
      - APP__SERVER__LISTEN_ADDRESS=/ip4/0.0.0.0/tcp/0
      - APP__WEBSOCKET__HOST=0.0.0.0
      - APP__WEBSOCKET__PORT=3000
      - APP__LOGGING__LEVEL=info
      - APP__LOGGING__ENABLE_DEBUG=false
      - APP__METRICS__ENABLED=true
      - APP__METRICS__ADDRESS=0.0.0.0:8080
      - APP__KAFKA__BOOTSTRAP_SERVERS=kafka:9092
    #      - RUST_LOG=info,libp2p_tcp=debug
    #      - RUST_LOG=info,libp2p_gossipsub=debug
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
    networks:
      - mdns_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '1'
  node2:
    image: tiktuzki/mdns_rr:latest
    container_name: node2
    hostname: node2
    expose:
      - "8080"
      - "3000"
    environment:
      - APP__SERVER__LISTEN_ADDRESS=/ip4/0.0.0.0/tcp/0
      - APP__WEBSOCKET__HOST=0.0.0.0
      - APP__WEBSOCKET__PORT=3000
      - APP__LOGGING__LEVEL=info
      - APP__LOGGING__ENABLE_DEBUG=false
      - APP__METRICS__ENABLED=true
      - APP__METRICS__ADDRESS=0.0.0.0:8080
      - APP__KAFKA__BOOTSTRAP_SERVERS=kafka:9092
    #      - RUST_LOG=info,libp2p_gossipsub=debug
    #      - RUST_LOG=info,libp2p_tcp=debug
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
    networks:
      - mdns_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '1'
  node3:
    image: tiktuzki/mdns_rr:latest
    container_name: node3
    hostname: node3
    expose:
      - "8080"
      - "3000"
    environment:
      - APP__SERVER__LISTEN_ADDRESS=/ip4/0.0.0.0/tcp/0
      - APP__WEBSOCKET__HOST=0.0.0.0
      - APP__WEBSOCKET__PORT=3000
      - APP__LOGGING__LEVEL=info
      - APP__LOGGING__ENABLE_DEBUG=false
      - APP__METRICS__ENABLED=true
      - APP__METRICS__ADDRESS=0.0.0.0:8080
      - APP__KAFKA__BOOTSTRAP_SERVERS=kafka:9092
    #      - RUST_LOG=info,libp2p_gossipsub=debug
    #      - RUST_LOG=info,libp2p_tcp=debug
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
    networks:
      - mdns_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2GB
        reservations:
          cpus: '1'
