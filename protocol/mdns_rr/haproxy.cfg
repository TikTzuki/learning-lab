global
    daemon
    maxconn 10000
    log stdout local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s
    option tcplog
    retries 3

frontend websocket_frontend
    bind *:3000
    mode tcp
    default_backend websocket_backend

     maxconn 10000

backend websocket_backend
    mode tcp
    balance roundrobin

    # TCP health checks
    option tcp-check
    tcp-check connect

    server mdns1 node1:3000 check inter 30s fall 3 rise 2
    server mdns2 node2:3000 check inter 30s fall 3 rise 2
    server mdns3 node3:3000 check inter 30s fall 3 rise 2

frontend http_frontend
    bind *:8080
    mode http
    default_backend http_backend

backend http_backend
    mode http
    balance roundrobin

    # HTTP health checks
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200

    server mdns1 node1:8080 check inter 30s fall 3 rise 2
    server mdns2 node2:8080 check inter 30s fall 3 rise 2
    server mdns3 node3:8080 check inter 30s fall 3 rise 2

# Statistics
frontend stats
    bind *:8404
    mode http
    stats enable

