global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'mdns-rr-nodes'
    static_configs:
      - targets:
          - 'mdns_rr_node1:9090'
          - 'mdns_rr_node2:9090'
          - 'mdns_rr_node3:9090'
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node_exporter_1:9100'
          - 'node_exporter_2:9100'
          - 'node_exporter_3:9100'
    scrape_interval: 15s